[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "kohakuclip"
version = "1.0.0"
description = "Fast random-access video clips for training: zip/tar/folders of mp4 + native batched decode"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Kohaku" }]
dependencies = ["numpy>=1.22"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
torch = ["torch>=2.3", "triton>=3"]
test = ["pytest>=8", "av>=14", "torch>=2.3", "pillow>=10"]
pillow = ["pillow>=10"]

[project.scripts]
kohakuclip-write = "kohakuclip.writer:main"
kohakuclip-write-images = "kohakuclip.image_writer:main"

[tool.maturin]
python-source = "src"
module-name = "kohakuclip._core"
features = ["pyo3/extension-module"]

[tool.black]
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Breakage only (syntax, undefined names); style is black's job.
select = ["E9", "F63", "F7", "F82"]
